name: Gemini Auto PR

on:
  issues:
    types: [labeled]

jobs:
  auto-pr:
    if: contains(github.event.issue.labels.*.name, 'gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-3.5-flash-lite'
          prompt: "Реши задачу из Issue #${{ github.event.issue.number }}. Изучи проект NexusDesk, напиши необходимый код, создай новую ветку, закоммить изменения и открой Pull Request."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'